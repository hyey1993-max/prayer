<title>Tracé 태극 릴스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* 단일 테마: 검은 바탕 태극. 9:16 캔버스 하나 (릴스용 미리보기). */
:root{ --page:#141416; --fg:#ecebe6; --dim:#8f8d86; --warm:#c98f66; color-scheme:dark;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"Noto Sans KR",system-ui,sans-serif }
body{background:var(--page);color:var(--fg);font:15px/1.6 var(--sans);margin:0;padding-inline:16px;padding-block:24px 48px}
main{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font:400 20px/1.3 var(--sans);margin:0} h1 b{font-weight:900}
p{color:var(--dim);margin:0;font-size:13px}
canvas{display:block;width:100%;height:auto;aspect-ratio:9/16;background:#0d0d10;border:1px solid #2a2a30}
button{align-self:flex-start;font:500 13px var(--mono);color:var(--fg);background:none;border:1px solid var(--fg);padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
</style>
<main>
  <div><h1>Tracé <b>음과 양</b> · Reels</h1><p>12초 반복. 모임 → 흩어짐 → 충돌 → 순환 → 다시 모임.</p></div>
  <canvas id="c" width="1080" height="1920" role="img" aria-label="흩어진 흰 입자와 검은 입자가 태극으로 모였다가, 저절로 흩어지고 부딪힌 뒤 다시 순환하며 모이는 12초 영상"></canvas>
  <button id="play" type="button" aria-pressed="true">재생 중</button>
</main>
<script>
(() => {
"use strict";
// 화면: 1080×1920. 인스타 릴스 UI가 덮는 위(약 220px)와 아래(약 380px), 오른쪽 버튼 영역(약 170px)은 비운다.
const W = 1080, H = 1920, CX = 540, CY = 820, R = 400, N = 13000, LOOP = 12;
const BG = [13,13,16], TILT = -0.62;            // 검은 바탕 (The Path 팔레트)
const MONO = '"IBM Plex Mono", ui-monospace, monospace', SANS = '"Noto Sans KR", system-ui, sans-serif';
// 에세이 원문 문장 (수정하지 않음)
const Q = {
  condense: ["응축", "이는 정제된 시스템 안으로 압축시켜 규칙을 만드는 일본의 ‘응축의 문화’와 닿아있다."],
  dynamic:  ["음과 양", "이것은 문화사적으로 음과 양의 에너지가 태극처럼 끊임없이 충돌하는 역동성을 나타낸다."],
  flow:     ["태극의 역동성", "음과 양이 서로를 밀어내고 끌어당기며 끊임없이 순환하는 태극의 ‘역동성’처럼, 유저의 시선과 동선은 인터페이스 위를 유연하게 흘러가야 한다."],
};
// 타임라인 [시작초, mix(0 응축 ~ 1 역동), 문장]
const TL = [[0, 0, "condense"], [3.5, .8, "dynamic"], [7, .45, "flow"], [9.6, 0, "flow"]];
const BURSTS = [3.5, 11.2];                                   // 이 순간 저절로 흩어진다
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v)), lerp = (a,b,k) => a + (b-a)*k;
const ease = k => k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function isWhite(x, y){ const c = Math.cos(TILT), s = Math.sin(TILT), u = x*c - y*s, v = x*s + y*c;
  if (Math.hypot(u, v + R/2) < R/2) return false; if (Math.hypot(u, v - R/2) < R/2) return true; return u < 0; }

let P, col, t = 0, ptr = null, pv = [0,0], burst = 0, fired = new Set();
function reset(seed = 7){
  const r = rng(seed); P = new Float32Array(N*6); col = new Uint8Array(N); t = 0; ptr = null; burst = 0; fired = new Set();
  for (let i = 0; i < N; i++){ let x, y; do { x = (r()*2-1)*R; y = (r()*2-1)*R; } while (x*x + y*y > R*R);
    if (Math.hypot(x, y) > R*.82){ const e = 1 + (r()-.5)*.18; x *= e; y *= e; }
    col[i] = isWhite(x, y) ? 1 : 0; const o = i*6;
    const k = 1.03 + r()*.22; P[o] = CX + x*k + (r()-.5)*24; P[o+1] = CY + y*k + (r()-.5)*24;   // 시작: 끝 장면과 이어지도록 거의 모인 상태
    P[o+4] = x; P[o+5] = y; }
}
function mixAt(tt){ let i = 0; while (i < TL.length - 1 && tt >= TL[i+1][0]) i++;
  const [t0, m0] = TL[i], prev = i ? TL[i-1][1] : TL[0][1]; return lerp(prev, m0, ease(clamp((tt - t0)/2.2))); }
function quoteAt(tt){ let i = 0; while (i < TL.length - 1 && tt >= TL[i+1][0]) i++; return { q: Q[TL[i][2]], age: tt - TL[i][0] }; }
function autoPointer(tt){ if (tt < 4.6 || tt > 7.4) return null;            // 역동 구간에 S자 경계를 따라 젓는다
  const u = (tt - 4.6)/2.8, a = u*Math.PI*1.4, s = Math.sin(a)*R*.55, c = Math.cos(TILT), sn = Math.sin(TILT);
  const lx = s*Math.cos(a*.5)*.9, ly = (u-.5)*R*1.6; return [CX + lx*c - ly*sn, CY + lx*sn + ly*c]; }

function step(){
  t += 1/60;
  for (const b of BURSTS) if (t >= b && !fired.has(b)){ fired.add(b); burst = 1.3; }
  const p = autoPointer(t); pv = p && ptr ? [p[0]-ptr[0], p[1]-ptr[1]] : [0,0]; ptr = p;
  const m = mixAt(t), early = clamp(t/1.6);                  // 처음 1.6초 동안 모이는 힘을 서서히 키운다
  const spring = lerp(.022, .0018, m) * lerp(.55, 1.6, early), flow = lerp(.05, .7, m), damp = lerp(.86, .94, m);
  const rot = t/LOOP*Math.PI*2   /* 12초에 정확히 한 바퀴: 끝과 처음이 같은 각도 */, cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < N; i++){ const o = i*6; let x = P[o], y = P[o+1], vx = P[o+2], vy = P[o+3];
    vx += (CX + P[o+4]*cr - P[o+5]*sr - x)*spring; vy += (CY + P[o+4]*sr + P[o+5]*cr - y)*spring;
    const sign = col[i] ? 1 : -1, a = Math.sin(x*.0045 + t*.35)*2.1 + Math.cos(y*.0052 - t*.28)*2.1 + sign*.9;
    vx += Math.cos(a)*flow*.18; vy += Math.sin(a)*flow*.18;
    const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy) + 1;
    vx += (-dy/d)*.05*(1+m)*sign; vy += (dx/d)*.05*(1+m)*sign;
    if (burst > 0){ vx += dx/d*burst*5 + (-dy/d)*burst*1.2*sign; vy += dy/d*burst*5 + (dx/d)*burst*1.2*sign; }
    if (ptr){ const ex = x - ptr[0], ey = y - ptr[1], e = Math.hypot(ex, ey);
      if (e < 220){ const f = 1 - e/220; vx += (-ey/(e+1))*f*1.1 + pv[0]*f*.15; vy += (ex/(e+1))*f*1.1 + pv[1]*f*.15; } }
    vx *= damp; vy *= damp; P[o] = x + vx; P[o+1] = y + vy; P[o+2] = vx; P[o+3] = vy; }
  burst *= .94; if (burst < .01) burst = 0;
}
function wrap(g, s, maxW){ const words = s.split(" "), out = []; let cur = "";
  for (const w of words){ const tr = cur ? cur + " " + w : w; if (g.measureText(tr).width > maxW && cur){ out.push(cur); cur = w; } else cur = tr; }
  if (cur) out.push(cur); return out; }
function draw(g, clear = false){
  g.setTransform(g.canvas.width/W, 0, 0, g.canvas.height/H, 0, 0);
  g.fillStyle = `rgba(${BG},${clear ? 1 : .17})`; g.fillRect(0, 0, W, H);
  g.lineCap = "round"; g.lineWidth = 2.8;
  for (let pass = 0; pass < 2; pass++){
    g.strokeStyle = pass ? "rgba(250,249,245,.62)" : "rgba(104,102,110,.8)"; g.beginPath();   // 양: 흰색, 음: 회색 (검은 바탕에서 두 반쪽이 갈리도록)
    for (let i = 0; i < N; i++){ if (col[i] !== pass) continue; const o = i*6, vx = P[o+2], vy = P[o+3], sp = Math.hypot(vx, vy), k = (Math.min(4, sp) + .6)/(sp + 1e-3);
      g.moveTo(P[o], P[o+1]); g.lineTo(P[o] - vx*k*2.2, P[o+1] - vy*k*2.2); }
    g.stroke();
  }
  // 글자 영역은 매 프레임 덮어써서 또렷하게
  g.fillStyle = `rgb(${BG})`; g.fillRect(0, 0, W, 300); g.fillRect(0, 1330, W, H - 1330);
  g.fillStyle = "#f2f0ea"; g.textBaseline = "alphabetic";
  g.font = `700 40px ${SANS}`; g.textAlign = "left"; g.fillText("Tracé", 80, 250);
  g.font = `400 26px ${MONO}`; g.textAlign = "right"; g.globalAlpha = .6; g.fillText("YIN · YANG", W - 80, 248); g.globalAlpha = 1;
  const { q, age } = quoteAt(t), a = clamp(age/.6);
  g.textAlign = "left"; g.globalAlpha = .6*a; g.font = `500 28px ${MONO}`; g.fillText(q[0], 80, 1420);
  g.globalAlpha = a; g.font = `700 42px ${SANS}`;
  wrap(g, q[1], W - 80 - 200).forEach((ln, i) => g.fillText(ln, 80, 1490 + i*60));
  g.globalAlpha = 1;
}
// 영상 추출용 (capture_taegeuk.js)
window.TAEGEUK = { reset(seed){ reset(seed); }, step, draw, W, H, LOOP, WARM: 0 };

const cv = document.getElementById("c"), g = cv.getContext("2d"), btn = document.getElementById("play");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing = !reduce, last = performance.now();
reset(); draw(g, true);
function frame(now){ if (!playing) return; const n = Math.max(1, Math.min(3, Math.round((now - last)/16.7) || 1)); last = now;
  for (let i = 0; i < n; i++){ step(); if (t >= LOOP){ reset(); draw(g, true); } } draw(g); requestAnimationFrame(frame); }
btn.addEventListener("click", () => { playing = !playing; btn.setAttribute("aria-pressed", String(playing)); btn.textContent = playing ? "재생 중" : "멈춤";
  if (playing){ last = performance.now(); requestAnimationFrame(frame); } });
if (reduce){ for (let i = 0; i < 300; i++) step(); draw(g, true); btn.setAttribute("aria-pressed", "false"); btn.textContent = "멈춤"; }
else (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(frame));
})();
</script>
