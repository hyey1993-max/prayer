<title>Tracé 라비린스와 미로</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* 단일 다크 테마(The Path 팔레트). 4:5 캔버스 하나. */
:root{ --bg:#0d0d10; --fg:#f2f0ea; --dim:#8f8d86; --line:#2a2a30; --warm:#c98f66; color-scheme:dark;
  --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"Noto Sans KR",system-ui,sans-serif }
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);margin:0;padding-inline:16px;padding-block:28px 56px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:400 22px/1.3 var(--sans);margin:0} h1 b{font-weight:900}
p{color:var(--dim);margin:0;font-size:14px}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;border:1px solid var(--line)}
button{align-self:flex-start;font:500 13px var(--mono);color:var(--fg);background:none;border:1px solid var(--fg);padding:6px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--warm);outline-offset:3px}
</style>
<main>
  <div><h1>Labyrinth <b>vs</b> Maze</h1><p>왼쪽은 길이 하나뿐인 라비린스, 오른쪽은 갈림길마다 고르는 미로. 13초 반복.</p></div>
  <canvas id="c" width="1080" height="1350" role="img" aria-label="왼쪽 라비린스에서는 점이 하나뿐인 길을 따라 중심에 닿고, 오른쪽 미로에서는 점이 막다른 길을 되돌아오며 출구를 찾는다."></canvas>
  <button id="play" type="button" aria-pressed="true">재생 중</button>
</main>
<script>
(() => {
"use strict";
const W = 1080, H = 1350, PERIOD = 13;
const C = { bg:"#0d0d10", fg:"#f2f0ea", wall:"rgba(242,240,234,.82)", dim:"rgba(242,240,234,.22)", warm:"#c98f66" };
const MONO = '"IBM Plex Mono", ui-monospace, monospace', SANS = '"Noto Sans KR", system-ui, sans-serif';
const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
function rng(seed){ let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function along(pts, k){ const L=[0]; for(let i=1;i<pts.length;i++) L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  const d=clamp(k)*L[L.length-1]; for(let i=1;i<pts.length;i++) if(d<=L[i]){ const u=(d-L[i-1])/((L[i]-L[i-1])||1); return [[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*u, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*u], i]; }
  return [pts[pts.length-1], pts.length-1]; }

// ---------- 라비린스: 동심원 7겹, 아래쪽 방사 벽, 갈 길은 하나 ----------
function labyrinthModel(R){
  const N = 7, r0 = R*0.16, w = (R - r0)/N, B = Math.PI/2;           // B: 아래쪽 방사 벽 각도
  const ringR = j => r0 + (j + .5)*w;                                // j=0 가장 안쪽 통로
  const gap = (k) => { const r = r0 + k*w, half = .42*w/r, off = .95*w/r; return { r, half, off }; };
  // 벽 k(0..N)의 구멍 각도: 바깥 벽(N)은 입구(B+off). 그 안쪽은 번갈아 B-off, B+off
  const holes = []; for (let k = N; k >= 0; k--){ const g = gap(k), i = N - k; holes[k] = { a: B + (i % 2 === 0 ? 1 : -1)*g.off, half: g.half }; }
  // 걷는 길: 바깥에서 입구로 들어와 통로마다 거의 한 바퀴씩 돌고 안쪽으로
  const path = []; const P = (r, a) => [Math.cos(a)*r, Math.sin(a)*r];
  path.push(P(R + w*1.2, holes[N].a)); path.push(P(R, holes[N].a));
  for (let j = N - 1; j >= 0; j--){
    const from = holes[j+1].a, to = holes[j].a, cw = ((N - 1 - j) % 2 === 0);   // 바깥부터 시계 방향, 다음은 반시계
    let a0 = from, a1 = to; if (cw && a1 <= a0) a1 += Math.PI*2; if (!cw && a1 >= a0) a1 -= Math.PI*2;
    const n = 90; for (let s = 0; s <= n; s++) path.push(P(ringR(j), a0 + (a1 - a0)*s/n));
    path.push(P(r0 + j*w, to));
  }
  path.push([0, 0]);
  return { N, r0, w, B, holes, path };
}
function drawLabyrinth(g, cx, cy, R, k, opts = {}){
  const m = labyrinthModel(R);
  g.save(); g.translate(cx, cy); g.lineCap = "round"; g.strokeStyle = opts.wall || C.wall; g.lineWidth = opts.lw || 5;
  for (let kk = 0; kk <= m.N; kk++){ const r = m.r0 + kk*m.w, h = m.holes[kk];
    g.beginPath(); g.arc(0, 0, r, h.a + h.half, h.a - h.half + Math.PI*2); g.stroke(); }
  g.beginPath(); g.moveTo(Math.cos(m.B)*m.r0, Math.sin(m.B)*m.r0); g.lineTo(Math.cos(m.B)*(m.r0 + m.N*m.w), Math.sin(m.B)*(m.r0 + m.N*m.w)); g.stroke();
  if (k > 0){
    const pts = m.path; const [pos, idx] = along(pts, k);
    g.strokeStyle = opts.trail || C.warm; g.lineWidth = opts.tw || 6; g.globalAlpha = .9; g.beginPath(); g.moveTo(...pts[0]);
    for (let i = 1; i < idx; i++) g.lineTo(...pts[i]); g.lineTo(...pos); g.stroke(); g.globalAlpha = 1;
    g.fillStyle = opts.dot || C.fg; g.beginPath(); g.arc(pos[0], pos[1], opts.dr || 12, 0, Math.PI*2); g.fill();
  }
  g.restore();
}

// ---------- 미로: 깊이 우선으로 만든 격자 미로 + 막다른 길을 되돌아오는 탐색 ----------
function mazeModel(n, seed = 5){
  const r = rng(seed), wall = Array.from({length: n*n}, () => [1,1,1,1]); // 위 오른쪽 아래 왼쪽
  const seen = new Uint8Array(n*n), st = [0]; seen[0] = 1; const D = [[0,-1],[1,0],[0,1],[-1,0]];
  while (st.length){ const c = st[st.length-1], x = c % n, y = (c / n) | 0;
    const opts = D.map((d,i)=>[i,x+d[0],y+d[1]]).filter(([,a,b])=>a>=0&&b>=0&&a<n&&b<n&&!seen[b*n+a]);
    if (!opts.length){ st.pop(); continue; }
    const [i,a,b] = opts[Math.floor(r()*opts.length)], nb = b*n+a; wall[c][i] = 0; wall[nb][(i+2)%4] = 0; seen[nb] = 1; st.push(nb); }
  // 탐색 기록: 왼쪽 위에서 오른쪽 아래까지, 갈림길에서 정해진 순서로 고르고 막히면 되돌아온다
  const goal = n*n - 1, vis = new Uint8Array(n*n), steps = [], stack = [0]; vis[0] = 1; steps.push(0);
  const order = [1,2,0,3];
  while (stack.length && stack[stack.length-1] !== goal){ const c = stack[stack.length-1], x = c % n, y = (c / n) | 0; let moved = false;
    for (const i of order){ if (wall[c][i]) continue; const a = x + D[i][0], b = y + D[i][1], nb = b*n + a; if (vis[nb]) continue;
      vis[nb] = 1; stack.push(nb); steps.push(nb); moved = true; break; }
    if (!moved){ stack.pop(); steps.push(stack[stack.length-1]); } }
  return { n, wall, steps, solution: stack.slice() };
}
function drawMaze(g, x0, y0, S, k, model, opts = {}){
  const n = model.n, cs = S/n;
  g.save(); g.lineCap = "square"; g.strokeStyle = opts.wall || C.wall; g.lineWidth = opts.lw || 5;
  g.beginPath();
  for (let c = 0; c < n*n; c++){ const x = x0 + (c % n)*cs, y = y0 + ((c / n) | 0)*cs, w = model.wall[c];
    if (c === 0) w[3] = 0; if (c === n*n - 1) w[1] = 0;                       // 입구와 출구
    if (w[0]){ g.moveTo(x, y); g.lineTo(x + cs, y); } if (w[1]){ g.moveTo(x + cs, y); g.lineTo(x + cs, y + cs); }
    if (w[2]){ g.moveTo(x, y + cs); g.lineTo(x + cs, y + cs); } if (w[3]){ g.moveTo(x, y); g.lineTo(x, y + cs); } }
  g.stroke();
  if (k > 0){
    const ctr = c => [x0 + (c % n + .5)*cs, y0 + (((c / n) | 0) + .5)*cs];
    const total = model.steps.length - 1, f = clamp(k)*total, i = Math.floor(f), u = f - i;
    // 지나온 칸 중 지금 길에서 벗어난 칸(막다른 길)은 흐리게
    const onPath = new Set(); const st = [];
    for (let s = 0; s <= i; s++){ const c = model.steps[s]; if (st.length > 1 && st[st.length-2] === c) st.pop(); else if (st[st.length-1] !== c) st.push(c); }
    st.forEach(c => onPath.add(c));
    g.fillStyle = opts.dead || "rgba(242,240,234,.16)";
    const done = new Set(model.steps.slice(0, i + 1));
    done.forEach(c => { if (!onPath.has(c)){ const [cx, cy] = ctr(c); g.fillRect(cx - cs*.32, cy - cs*.32, cs*.64, cs*.64); } });
    g.strokeStyle = opts.trail || C.warm; g.lineWidth = opts.tw || 6; g.lineJoin = "round"; g.beginPath();
    st.forEach((c, j) => { const [cx, cy] = ctr(c); j ? g.lineTo(cx, cy) : g.moveTo(cx, cy); }); g.stroke();
    const a = ctr(model.steps[i]), b = ctr(model.steps[Math.min(total, i + 1)]);
    g.fillStyle = opts.dot || C.fg; g.beginPath(); g.arc(a[0] + (b[0]-a[0])*u, a[1] + (b[1]-a[1])*u, opts.dr || 11, 0, Math.PI*2); g.fill();
  }
  g.restore();
}

// ---------- 장면 ----------
const MAZE = mazeModel(13, 5);
const QUOTE = ["통제하려는 목적성을 내려놓고,", "도시라는 라비린스를 거닐며", "이미 당신을 위해 준비된", "하나의 실재(The Plan)를 발견하라"];
function scene(g, t){
  g.setTransform(g.canvas.width/W, 0, 0, g.canvas.height/H, 0, 0);
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const p = (t % PERIOD)/PERIOD, k = clamp(p/.85), fade = 1 - clamp((p - .93)/.07);
  g.globalAlpha = 1;
  g.fillStyle = C.fg; g.font = `700 30px ${SANS}`; g.textAlign = "left"; g.fillText("Tracé", 80, 112);
  g.font = `400 24px ${MONO}`; g.textAlign = "right"; g.globalAlpha = .55; g.fillText("STORY CH.2", W - 80, 110); g.globalAlpha = 1;
  g.globalAlpha = fade;
  drawLabyrinth(g, 290, 520, 215, k);
  drawMaze(g, 575, 305, 430, k, MAZE, { lw: 4, tw: 5, dr: 10 });
  g.globalAlpha = 1;
  g.textAlign = "center"; g.font = `500 26px ${MONO}`; g.fillStyle = C.fg;
  g.fillText("LABYRINTH", 290, 820); g.fillText("MAZE", 790, 820);
  g.font = `400 24px ${SANS}`; g.globalAlpha = .55; g.fillText("라비린스", 290, 858); g.fillText("미로", 790, 858); g.globalAlpha = 1;
  g.fillStyle = C.fg; g.font = `700 44px ${SANS}`; g.textAlign = "left";
  QUOTE.forEach((ln, i) => { g.globalAlpha = i === 3 ? 1 : .88; if (i === 3){ g.fillStyle = C.warm; } g.fillText(ln, 80, 1010 + i*62); g.fillStyle = C.fg; });
  g.globalAlpha = 1;
}
// 카드용 정지 이미지와 영상 추출용
window.CH2 = { labyrinth(g, S, k = 1){ g.setTransform(1,0,0,1,0,0); g.fillStyle = C.bg; g.fillRect(0,0,S,S); drawLabyrinth(g, S/2, S/2, S*.4, k, { lw: S/180, tw: S/150, dr: S/80 }); },
  maze(g, S, k = .55){ g.setTransform(1,0,0,1,0,0); g.fillStyle = C.bg; g.fillRect(0,0,S,S); drawMaze(g, S*.1, S*.1, S*.8, k, MAZE, { lw: S/220, tw: S/180, dr: S/90 }); } };
window.TRACE_SCENES = { list: [{ group: "STORY", no: "CH.2", title: "라비린스와 미로", en: "Labyrinth vs Maze", period: PERIOD }], W, H,
  renderAt(i, t, ctx){ scene(ctx, t); } };

const cv = document.getElementById("c"), g = cv.getContext("2d"), btn = document.getElementById("play");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let playing = !reduce, start = performance.now(), held = PERIOD*.86;
function tick(){ scene(g, playing ? (performance.now() - start)/1000 : held); if (playing) requestAnimationFrame(tick); }
btn.addEventListener("click", () => { if (playing){ held = (performance.now() - start)/1000; } else { start = performance.now() - held*1000; }
  playing = !playing; btn.setAttribute("aria-pressed", String(playing)); btn.textContent = playing ? "재생 중" : "멈춤"; if (playing) requestAnimationFrame(tick); else tick(); });
if (reduce){ btn.setAttribute("aria-pressed", "false"); btn.textContent = "멈춤"; }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(tick); tick();
})();
</script>
